<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi — Ferramentas de IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #16161f;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f5;
    --muted: #6b6b80;
    --accent-video: #ff3c6e;
    --accent-chat: #00e5a0;
    --accent-image: #a259ff;
    --accent-flow: #ff8c00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* Ambient glow */
  .ambient {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .ambient-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(162,89,255,0.06) 0%, transparent 70%);
    top: -200px; right: -100px;
  }
  .ambient-2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,229,160,0.05) 0%, transparent 70%);
    bottom: -150px; left: -100px;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 32px 80px;
  }

  /* Header */
  header {
    margin-bottom: 64px;
    animation: fadeUp 0.6s ease both;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-chat);
    animation: pulse 2s ease infinite;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(42px, 6vw, 72px);
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  h1 span {
    background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 16px;
    color: var(--muted);
    font-weight: 300;
    max-width: 440px;
    line-height: 1.6;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.23,1,0.32,1),
                border-color 0.3s ease,
                background 0.3s ease;
    animation: fadeUp 0.6s ease both;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.04) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.14);
    background: var(--surface2);
  }
  .card:hover::before { opacity: 1; }

  /* Card glow accent on hover */
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: var(--card-accent, rgba(255,255,255,0.1));
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .card:hover::after { opacity: 1; }

  /* Card top row */
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .badge {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid currentColor;
  }
  .badge-video { color: var(--accent-video); border-color: rgba(255,60,110,0.3); background: rgba(255,60,110,0.08); }
  .badge-chat  { color: var(--accent-chat);  border-color: rgba(0,229,160,0.3);   background: rgba(0,229,160,0.08); }
  .badge-image { color: var(--accent-image); border-color: rgba(162,89,255,0.3);  background: rgba(162,89,255,0.08); }
  .badge-flow  { color: var(--accent-flow);  border-color: rgba(255,140,0,0.3);   background: rgba(255,140,0,0.08); }

  /* Card body */
  .card-body { flex: 1; }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 10px;
    color: var(--text);
  }

  .card-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    font-weight: 300;
  }
  .card-sub em {
    font-style: normal;
    color: rgba(240,240,245,0.6);
  }

  /* Arrow */
  .card-arrow {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: flex-end;
    transition: all 0.3s ease;
    color: var(--muted);
    font-size: 14px;
  }
  .card:hover .card-arrow {
    background: var(--card-accent, rgba(255,255,255,0.1));
    border-color: transparent;
    color: #fff;
    transform: translate(2px, -2px);
  }

  /* Stagger animations */
  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
  .card:nth-child(4) { animation-delay: 0.25s; }
  .card:nth-child(5) { animation-delay: 0.3s; }
  .card:nth-child(6) { animation-delay: 0.35s; }
  .card:nth-child(7) { animation-delay: 0.4s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Footer */
  footer {
    margin-top: 64px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    opacity: 0.5;
    animation: fadeUp 0.6s 0.5s ease both;
  }
</style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="wrapper">
  <header>
    <div class="logo">
      <span class="logo-dot"></span>
      Mi — Seu guia de IA
    </div>
    <h1><span>Ferramentas que<br>vão mudar seu jeito<br>de criar.</span></h1>
    <p class="subtitle">Um mapa das principais IAs do mundo, curado pra você que está começando essa jornada.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Mi · feito com carinho pra você aprender ✦</footer>
</div>

<script>
const tools = [
  {
    name: "Higgsfield",
    title: "O mundo completo de criações",
    sub: "Aqui você transforma prompts em vídeos cinematográficos <em>de verdade</em>",
    badge: "Vídeo",
    badgeClass: "badge-video",
    icon: "🎬",
    url: "https://higgsfield.ai",
    accent: "rgba(255,60,110,0.5)"
  },
  {
    name: "ChatGPT",
    title: "O assistente que todo mundo conhece",
    sub: "Aqui você conversa, cria, resolve e aprende com a IA <em>mais famosa do mundo</em>",
    badge: "Chat",
    badgeClass: "badge-chat",
    icon: "✦",
    url: "https://chat.openai.com",
    accent: "rgba(0,229,160,0.5)"
  },
  {
    name: "Gemini",
    title: "A IA do Google",
    sub: "Aqui você usa o poder do Google pra <em>pesquisar, criar e automatizar</em>",
    badge: "Chat",
    badgeClass: "badge-chat",
    icon: "◈",
    url: "https://gemini.google.com",
    accent: "rgba(0,229,160,0.5)"
  },
  {
    name: "Flow",
    title: "Cinema gerado por IA",
    sub: "Aqui você cria cenas cinematográficas <em>sem precisar de câmera nenhuma</em>",
    badge: "Vídeo",
    badgeClass: "badge-video",
    icon: "▶",
    url: "https://flowgpt.com",
    accent: "rgba(255,140,0,0.5)"
  },
  {
    name: "Grok",
    title: "A IA sem filtro",
    sub: "Aqui você encontra respostas diretas, com <em>personalidade e sem rodeios</em>",
    badge: "Chat",
    badgeClass: "badge-chat",
    icon: "⚡",
    url: "https://grok.com",
    accent: "rgba(0,229,160,0.5)"
  },
  {
    name: "Claude",
    title: "Inteligência com profundidade",
    sub: "Aqui você pensa, escreve e cria com uma IA que <em>realmente entende contexto</em>",
    badge: "Chat",
    badgeClass: "badge-chat",
    icon: "◎",
    url: "https://claude.ai",
    accent: "rgba(0,229,160,0.5)"
  },
  {
    name: "Midjourney",
    title: "Arte gerada por prompt",
    sub: "Aqui você transforma palavras em imagens que <em>parecem pintadas por um artista</em>",
    badge: "Imagem",
    badgeClass: "badge-image",
    icon: "◉",
    url: "https://midjourney.com",
    accent: "rgba(162,89,255,0.5)"
  }
];

const grid = document.getElementById('grid');

tools.forEach(t => {
  const a = document.createElement('a');
  a.href = t.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.className = 'card';
  a.style.setProperty('--card-accent', t.accent);
  a.innerHTML = `
    <div class="card-top">
      <div class="card-icon">${t.icon}</div>
      <span class="badge ${t.badgeClass}">${t.badge}</span>
    </div>
    <div class="card-body">
      <div class="card-name">${t.name}</div>
      <div class="card-title">${t.title}</div>
      <div class="card-sub">${t.sub}</div>
    </div>
    <div class="card-arrow">↗</div>
  `;

  // Mouse glow
  a.addEventListener('mousemove', e => {
    const r = a.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    a.style.setProperty('--mx', x + '%');
    a.style.setProperty('--my', y + '%');
  });

  grid.appendChild(a);
});
</script>
</body>
</html>
